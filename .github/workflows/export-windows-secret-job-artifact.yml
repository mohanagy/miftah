name: Export Windows helper artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile checked helper
        shell: pwsh
        run: ./scripts/export-windows-secret-job-assembly.ps1 -OutputPath assets/windows-secret-job.exe
      - name: Upload checked helper
        uses: actions/upload-artifact@v4
        with:
          name: windows-secret-job-exe
          path: assets/windows-secret-job.exe
          if-no-files-found: error
          retention-days: 1
